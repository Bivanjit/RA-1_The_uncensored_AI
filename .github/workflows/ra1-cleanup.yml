name: RA-1 cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup-branding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebrand frontend without touching model identifiers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace('WormGPT', 'RA-1')
          s = s.replace('wormgpt', 'ra1')
          s = s.replace('wormgpt-logo.jpg', 'ra1-logo.svg')
          s = s.replace('https://freewormgpt.netlify.app', 'RA-1')
          s = s.replace("const CORRECT_PASSWORD = 'Realnojokepplwazy1234';", "const CORRECT_PASSWORD = import.meta.env.VITE_RA1_ACCESS_CODE || '';\n")
          p.write_text(s)
          PY

      - name: Remove temporary workflow and commit changes
        shell: bash
        run: |
          git config user.name 'RA-1 Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/ra1-cleanup.yml
          git add src/App.tsx .github/workflows/ra1-cleanup.yml
          git diff --cached --quiet || git commit -m 'Rebrand app to RA-1 and remove hardcoded access code'
          git push