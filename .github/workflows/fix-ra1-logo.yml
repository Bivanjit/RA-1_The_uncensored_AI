name: RA-1 Logo Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify RA-1 logo exists
        run: |
          test -f public/RA1-logo.png
          echo "RA-1 logo is present at public/RA1-logo.png"
